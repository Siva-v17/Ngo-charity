</style>

<body>

    <!-- ============ PRELOADER ============ -->

    <div
        id="pre"
        role="status"
        aria-label="Loading"
    >

        <img
            src="./stackly.png"
            alt="Stackly"
        />

        <div class="stackly-error-pb"><i></i></div>

        <div class="stackly-error-pt"><span id="pn">0</span>%</div>

    </div>


    <main>

        <!-- ============ THIS PAGE IS NOT AVAILABLE ============ -->

        <section class="stackly-error-hero stackly-error-err">

            <div
                class="stackly-error-bgimg"
                style="background-image:url(https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&amp;fit=crop&amp;w=3840&amp;q=80)"
            ></div>

            <div class="stackly-error-blob stackly-error-b1"></div>

            <div class="stackly-error-blob stackly-error-b2"></div>

            <canvas class="stackly-error-net"></canvas>

            <div class="stackly-error-wrap">

                <div
                    class="stackly-error-code"
                    aria-hidden="true"
                >4<span class="stackly-error-zero">0</span>4</div>

                <h1 data-split>This page is not available</h1>

                <p

                >
                    The page you are looking for has moved, is being updated, or does not exist yet. Our team is working on it &mdash; meanwhile, your support keeps the work going.

                        class="stackly-error-btn stackly-error-o"

                    >Go back</a>

                    class="stackly-error-quick"
                    data-fade
                    aria-label="Helpful links"
                >

                    <a href="about.html">About Us</a>

                    <a href="services.html">Services</a>

                    <a href="charity.html">Charity</a>

                    <a href="blog.html">Blog</a>

                </nav>

            </div>

    </main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(s,c){return (c||document).querySelector(s)};
  var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};

  /* ---------- Storage + session helpers ---------- */
  var DB = {
    get: function(k,d){
      try{ var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; }
      catch(e){ return d; }
    },
    set: function(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
  };
  var norm = function(e){ return String(e || '').trim().toLowerCase(); };
  var session = function(){
    var s = DB.get('stk_session', null);
    return s && s.email ? s : null;
  };

  /* ---------- Image + logo fallbacks ---------- */
  var placeholder = function(img){
    var d = document.createElement('div');
    d.className = 'stackly-error-ph';
    d.setAttribute('role','img');
    d.setAttribute('aria-label', img.alt);
    d.innerHTML = '<span>&hearts;</span>';
    img.replaceWith(d);
  };
  $$('main img').forEach(function(img){
    img.addEventListener('error', function(){ placeholder(img); });
    if(img.complete && !img.naturalWidth){ placeholder(img); }
  });

  var watermark = function(img){
    var s = document.createElement('span');
    s.className = 'stackly-error-wm';
    s.textContent = 'Stackly';
    img.replaceWith(s);
  };
  $$('.stackly-error-logo img, #pre img').forEach(function(img){
    img.addEventListener('error', function(){ watermark(img); });
    if(img.complete && !img.naturalWidth){ watermark(img); }
  });

  /* ---------- Go back button ---------- */
  var goBack = $('#goBack');
  if(goBack){
    goBack.addEventListener('click', function(e){
      e.preventDefault();
      if(window.history.length > 1){ window.history.back(); } else { window.location.href = 'index.html'; }
    });
  }

  /* ---------- Newsletter forms ---------- */
  $$('form.stackly-error-nl, form.stackly-error-sf').forEach(function(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      form.innerHTML = '<b>Thanks for subscribing!</b>';
    });
  });

  /* ---------- Preloader ---------- */
  var pre = $('#pre');
  if(pre){
    document.body.style.overflow = 'hidden';
    var pn = $('#pn'), pbar = $('.stackly-error-pb i', pre), done = false;
    var out = function(){
      if(done){ return; }
      done = true;
      document.body.style.overflow = '';
      if(window.gsap){
        gsap.to(pre,{yPercent:-100,duration:.9,ease:'power4.inOut',onComplete:function(){ pre.remove(); }});
      } else { pre.remove(); }
    };
    if(window.gsap){
      var o = {v:0};
      gsap.to(o,{v:100,duration:1.3,ease:'power2.inOut',
        onUpdate:function(){ pn.textContent = Math.round(o.v); pbar.style.width = o.v + '%'; },
        onComplete:function(){ if(document.readyState === 'complete'){ out(); } else { window.addEventListener('load', out); } }
      });
    }
    setTimeout(out, 5000);
  }

  /* ---------- Animations ---------- */
  if(!window.gsap){ return; }
  gsap.registerPlugin(ScrollTrigger);

  // Split headings into letters that rise in
  $$('[data-split]').forEach(function(el){
    var text = el.textContent;
    el.setAttribute('aria-label', text);
    el.innerHTML = text.split(' ').map(function(w){
      return '<span class="stackly-error-ch" aria-hidden="true">' + w.split('').map(function(c){ return '<span>' + c + '</span>'; }).join('') + '</span>';
    }).join(' ');
    if(reduce){ return; }
    gsap.from($$('.stackly-error-ch>span', el),{
      yPercent:110, rotate:8, opacity:0, duration:1, ease:'expo.out', stagger:.025,
      delay: el.closest('.stackly-error-hero') ? 1.5 : 0,
      scrollTrigger:{trigger:el,start:'top 88%'}
    });
  });
  if(reduce){
    // No motion: show final numbers and bar widths straight away
    $$('[data-count]').forEach(function(n){ n.textContent = (+n.dataset.count).toLocaleString() + (n.dataset.s || ''); });
    $$('.stackly-error-bar i').forEach(function(b){ b.style.width = b.dataset.w + '%'; });
    return;
  }

  // Fade-up copy
  $$('[data-fade]').forEach(function(el){
    gsap.from(el,{y:50,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%'}});
  });

  // Card groups: staggered entrance
  $$('.stackly-error-grid').forEach(function(g){
    gsap.from(g.children,{y:60,opacity:0,duration:.8,stagger:.12,ease:'power3.out',scrollTrigger:{trigger:g,start:'top 85%'}});
  });

  // Photos: wipe in, then drift with scroll
  $$('.stackly-error-imgw').forEach(function(w){
    var img = $('img', w);
    gsap.from(w,{clipPath:'inset(0 100% 0 0)',duration:1.2,ease:'power4.inOut',scrollTrigger:{trigger:w,start:'top 85%'}});
    gsap.to(img,{scale:1,yPercent:-8,ease:'none',scrollTrigger:{trigger:w,scrub:true}});
  });

  // Hero background parallax + floating blobs
  $$('.stackly-error-hero .stackly-error-bgimg').forEach(function(b){
    gsap.to(b,{yPercent:18,ease:'none',scrollTrigger:{trigger:b.parentNode,scrub:true,start:'top top',end:'bottom top'}});
  });
  $$('.stackly-error-blob').forEach(function(b){
    gsap.to(b,{x:'random(-80,80)',y:'random(-70,70)',scale:'random(.8,1.3)',duration:'random(5,9)',repeat:-1,yoyo:true,ease:'sine.inOut'});
  });

  // Counters
  $$('[data-count]').forEach(function(n){
    var o = {v:0}, target = +n.dataset.count;
    gsap.to(o,{v:target,duration:2.2,ease:'power2.out',scrollTrigger:{trigger:n,start:'top 90%'},
      onUpdate:function(){ n.textContent = Math.round(o.v).toLocaleString() + (n.dataset.s || ''); }
    });
  });

  // Progress bars
  $$('.stackly-error-bar i').forEach(function(b){
    gsap.to(b,{width:b.dataset.w + '%',duration:1.6,ease:'power3.out',scrollTrigger:{trigger:b,start:'top 92%'}});
  });

  // Marquee
  $$('.stackly-error-marq div').forEach(function(m){
    gsap.to(m,{xPercent:-50,duration:22,ease:'none',repeat:-1});
  });

  // Magnetic buttons
  $$('.stackly-error-btn').forEach(function(b){
    b.addEventListener('mousemove', function(e){
      var r = b.getBoundingClientRect();
      gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.25,y:(e.clientY-r.top-r.height/2)*.35,duration:.3});
    });
    b.addEventListener('mouseleave', function(){ gsap.to(b,{x:0,y:0,duration:.6,ease:'elastic.out(1,.4)'}); });
  });

  // Interactive particle network
  $$('canvas.stackly-error-net').forEach(function(cv){
    var x = cv.getContext('2d'), W, H, m = {x:-1e3,y:-1e3};
    var resize = function(){ W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    var count = window.innerWidth < 768 ? 30 : 70, ps = [];
    for(var n = 0; n < count; n++){
      ps.push({x:Math.random()*W,y:Math.random()*H,vx:Math.random()-.5,vy:Math.random()-.5});
    }
    cv.parentNode.addEventListener('mousemove', function(e){
      var r = cv.getBoundingClientRect();
      m = {x:e.clientX-r.left,y:e.clientY-r.top};
    });
    (function frame(){
      x.clearRect(0,0,W,H);
      ps.forEach(function(p,i){
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > W){ p.vx *= -1; }
        if(p.y < 0 || p.y > H){ p.vy *= -1; }
        x.fillStyle = 'rgba(255,200,61,.8)';
        x.fillRect(p.x,p.y,2.5,2.5);
        for(var j = i + 1; j < ps.length; j++){
          var q = ps[j], d = Math.hypot(p.x-q.x,p.y-q.y);
          if(d < 120){
            x.strokeStyle = 'rgba(255,255,255,' + (.18*(1-d/120)) + ')';
            x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke();
          }
        }
        var dm = Math.hypot(p.x-m.x,p.y-m.y);
        if(dm < 160){
          x.strokeStyle = 'rgba(255,200,61,' + (.5*(1-dm/160)) + ')';
          x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(m.x,m.y); x.stroke();
        }
      });
      requestAnimationFrame(frame);
    })();
  });

  window.addEventListener('load', function(){ ScrollTrigger.refresh(); });
})();
</script>
